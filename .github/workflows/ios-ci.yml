name: iOS CI + Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package Hawaian
    runs-on: xcode-27
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27.1 SDK (compatible with iOS 27.2)
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS 27\\.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Simulator build/test are intentionally omitted from the IPA pipeline.
      # The deliverable is a device-arm64 app; simulator runtime availability is independent.

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project Hawaian.xcodeproj \
            -scheme Hawaian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/Hawaian.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/Hawaian.app
          (cd build/ipa && /usr/bin/zip -qry Hawaian-unsigned.ipa Payload)
          test -s build/ipa/Hawaian-unsigned.ipa
          ls -lh build/ipa/Hawaian-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hawaian-unsigned-iOS-27.2-compatible
          path: build/ipa/Hawaian-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
