name: iOS CI + Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package Hawaian
    runs-on: xcode-27
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode and iOS 27.2 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS 27(\\.2)?"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Hawaian.xcodeproj \
            -scheme Hawaian \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"] and x["isAvailable"]]; print(xs[0] if xs else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcodebuild \
            -project Hawaian.xcodeproj \
            -scheme Hawaian \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project Hawaian.xcodeproj \
            -scheme Hawaian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/Hawaian.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/Hawaian.app
          (cd build/ipa && /usr/bin/zip -qry Hawaian-unsigned.ipa Payload)
          test -s build/ipa/Hawaian-unsigned.ipa
          ls -lh build/ipa/Hawaian-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hawaian-unsigned-iOS-27.2
          path: build/ipa/Hawaian-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
